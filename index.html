<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Reading Room</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700;8..60,400i;8..60,500i&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.6.82/pdf.min.mjs" type="module"></script>
  <style>
    :root { --ink:#14181F; --ink-soft:#454C43; --paper:#EAEEE3; --card:#F6F8F1; --rule:#C7CDBE; --evidence:#2F6F5E; --evidence-bg:#E3EEE8; --author:#A9791F; --author-bg:#F4EAD3; --inferred:#A6432B; --inferred-bg:#F5E1DA; --numbers:#4A4E9E; --numbers-bg:#E6E7F5; }
    * { box-sizing:border-box } body { margin:0; font-family:'IBM Plex Sans',sans-serif; color:var(--ink); background:var(--paper); }
    button,input { font:inherit } button { cursor:pointer } .app { min-height:100vh; display:flex }
    .sidebar { width:294px; flex:none; background:var(--ink); color:#edf1e7; display:flex; flex-direction:column; padding:29px 16px 17px; position:sticky; top:0; height:100vh; }
    .wordmark { font:500 31px/1 'Source Serif 4',serif; letter-spacing:-.045em; padding:1px 11px 34px } .wordmark small { display:block; margin-top:8px; font:500 10px 'IBM Plex Mono',monospace; letter-spacing:.12em; text-transform:uppercase; color:#9fa89e }
    .catalog-link,.spine { border:0; color:inherit; background:transparent; text-align:left; width:100%; border-left:3px solid transparent; border-radius:3px; padding:12px 11px; display:flex; gap:10px; align-items:center; }
    .catalog-link { color:#e6ebe1; font-size:14px; margin-bottom:21px; } .catalog-link.active,.spine.active { background:#252c2a; border-left-color:#92bcae; } .nav-glyph { font:16px 'IBM Plex Mono'; color:#9fc9ba }
    .shelf-label { padding:0 11px 9px; font:500 10px 'IBM Plex Mono'; color:#9fa89e; letter-spacing:.13em; text-transform:uppercase; } .shelf { overflow:auto; min-height:0; }
    .spine { font-size:13px; line-height:1.25; padding:11px; } .spine-dot { width:7px; height:7px; background:#6f9d91; border-radius:50%; flex:none; } .spine-title { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .sidebar-foot { margin-top:auto; padding-top:14px; border-top:1px solid #343b3b; display:grid; grid-template-columns:1fr 34px; gap:8px; } .upload-btn,.settings-btn { border:1px solid #779488; background:#dce9e0; color:var(--ink); border-radius:3px; font-weight:600; } .upload-btn { padding:11px; } .settings-btn { background:transparent; color:#c7d2c8; font-size:18px; }
    main { flex:1; min-width:0; } .page { max-width:1080px; margin:auto; padding:53px 55px 75px; } .eyebrow { font:500 10px 'IBM Plex Mono'; text-transform:uppercase; letter-spacing:.13em; color:var(--ink-soft); }
    .head-row { display:flex; justify-content:space-between; align-items:end; gap:16px; margin-bottom:26px; } h1 { font:500 42px/1.08 'Source Serif 4',serif; letter-spacing:-.045em; margin:9px 0 0; } .paper-count { font:500 11px 'IBM Plex Mono'; color:var(--ink-soft); white-space:nowrap; }
    .catalog-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(247px,1fr)); gap:15px; } .paper-card { background:var(--card); border:1px solid var(--rule); border-top:4px solid var(--numbers); padding:20px 19px 17px; min-height:199px; text-align:left; transition:transform .18s,box-shadow .18s; border-radius:2px; display:flex; flex-direction:column; } .paper-card:hover { transform:translateY(-4px); box-shadow:0 10px 22px #34422f1f; } .card-title { font:500 22px/1.07 'Source Serif 4'; letter-spacing:-.026em; margin:11px 0 10px; } .card-thesis { font-size:13px; line-height:1.45; color:var(--ink-soft); margin:0; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; } .chips { margin-top:auto; padding-top:15px; display:flex; gap:5px; flex-wrap:wrap; } .chip { font:500 10px 'IBM Plex Mono'; padding:4px 6px; border-radius:2px; background:var(--evidence-bg); color:var(--evidence); } .chip.gap { color:var(--author); background:var(--author-bg) }.chip.figure {color:var(--numbers);background:var(--numbers-bg)}
    .empty { border:1px dashed #aeb7a9; padding:55px 30px; text-align:center; color:var(--ink-soft); background:#f3f6ed99; }.empty h2{font:500 27px 'Source Serif 4';margin:0 0 8px;color:var(--ink)}
    .desk { margin-top:43px; background:var(--ink); color:#eef2e9; padding:28px; border-radius:3px; position:relative; overflow:hidden; }.desk:after { content:''; position:absolute; right:-45px; top:-45px; width:155px; height:155px; border:1px solid #56625d; border-radius:50%; }.desk h2 { font:500 27px/1 'Source Serif 4'; margin:6px 0 8px; }.desk p { color:#b9c2b8; font-size:13px; margin:0 0 20px; }.query-form { display:flex; gap:9px; position:relative; z-index:1 }.query-input { flex:1; min-width:0; padding:12px 13px; border:1px solid #59635f; background:#222931; color:white; border-radius:2px; outline:none }.query-input:focus{border-color:#aabbb1}.ask-btn { border:0; border-radius:2px; padding:0 17px; background:#dce9e0; font-weight:600; color:var(--ink) }.thread { position:relative; z-index:1; margin-top:20px; display:grid; gap:12px; }.qa { border-left:2px solid #789e91; padding-left:12px; }.qa-q { font:500 11px 'IBM Plex Mono'; color:#a8c6ba; margin-bottom:5px; }.qa-a { font-size:14px; line-height:1.55; white-space:pre-wrap; }.qa.loading .qa-a{color:#b9c2b8}
    .detail-top { border-bottom:1px solid var(--rule); padding-bottom:23px; margin-bottom:35px; }.file-meta { font:500 10px/1.5 'IBM Plex Mono'; color:var(--ink-soft); margin-top:13px; }.detail-title { font:500 44px/1.08 'Source Serif 4'; letter-spacing:-.05em; margin:12px 0 0; }.remove { border:1px solid #c78f81; background:transparent; color:#8c351f; padding:8px 10px; border-radius:2px; font:500 10px 'IBM Plex Mono'; white-space:nowrap; }
    .thesis { margin:0 0 44px; padding:13px 0 13px 24px; border-left:4px solid var(--numbers); font:italic 26px/1.35 'Source Serif 4'; letter-spacing:-.02em; max-width:850px; }.section { margin:0 0 44px; }.margin-tag { display:block; width:max-content; max-width:100%; font:600 25px/1 Caveat; text-transform:uppercase; letter-spacing:.035em; white-space:normal; margin:0 0 9px 2px; }.section-title { font:500 24px/1.2 'Source Serif 4'; margin:0 0 15px; }.summary { font-size:16px; line-height:1.75; margin:0; max-width:850px; }.checklist { list-style:none; padding:0; margin:0; display:grid; gap:10px; }.checklist li { font-size:14px; line-height:1.55; padding-left:23px; position:relative; }.checklist li:before { content:'✓'; position:absolute; left:0; font-weight:600; }
    .comparison { display:grid; grid-template-columns:1fr 1fr; gap:15px; }.compare-card { border:1px solid var(--rule); padding:18px; border-radius:2px; }.compare-card h3 { font:500 11px 'IBM Plex Mono'; letter-spacing:.05em; text-transform:uppercase; margin:0 0 14px; }.author-card { background:var(--author-bg) }.author-card h3,.author-card li:before {color:var(--author)}.inferred-card{background:var(--inferred-bg)}.inferred-card h3,.inferred-card li:before{color:var(--inferred)} .number-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:11px; }.stat { background:var(--numbers-bg); border:1px solid #c5c8e9; padding:16px; min-height:104px; }.stat-value { color:var(--numbers); font:500 23px/1.1 'IBM Plex Mono'; letter-spacing:-.06em; overflow-wrap:anywhere }.stat-label { color:#464878; font-size:12px; line-height:1.35; margin-top:9px }.done-card { background:var(--evidence-bg) }.done-card h3,.done-card li:before{color:var(--evidence)}.todo-card{background:var(--inferred-bg)}.todo-card h3,.todo-card li:before{color:var(--inferred)}
    .reading-map { margin:0 0 40px; padding:20px; background:var(--card); border:1px solid var(--rule); }.reading-map-title { font:500 11px 'IBM Plex Mono'; letter-spacing:.09em; text-transform:uppercase; color:var(--ink-soft); margin-bottom:16px; }.map-bars { display:grid; gap:13px; }.map-row { display:grid; grid-template-columns:110px 1fr 30px; align-items:center; gap:10px; font:500 11px 'IBM Plex Mono'; }.map-track { display:flex; height:11px; background:#dfe4da; overflow:hidden; border-radius:10px; }.map-segment { min-width:7px; height:100%; }.map-legend { display:flex; flex-wrap:wrap; gap:12px; margin-top:15px; font:500 10px 'IBM Plex Mono'; color:var(--ink-soft); }.legend-dot { width:8px; height:8px; display:inline-block; border-radius:50%; margin-right:4px; }.collection-map { margin:0 0 28px; padding:18px 19px; background:var(--card); border:1px solid var(--rule); }.collection-map h2 { font:500 23px 'Source Serif 4'; margin:0 0 14px; }.collection-rows { display:grid; gap:10px; }.collection-row { display:grid; grid-template-columns:minmax(100px,190px) 1fr 48px; gap:10px; align-items:center; font-size:12px; }.collection-title { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }.collection-track { height:8px; background:#dde3d8; display:flex; overflow:hidden; border-radius:7px; }.collection-count { font:500 10px 'IBM Plex Mono'; text-align:right; color:var(--ink-soft); }
    .inline-error { background:var(--inferred-bg); color:#7c2d1b; border:1px solid #d5a194; padding:12px 14px; font-size:13px; margin:0 0 18px; border-radius:2px; }.status { display:flex; gap:9px; align-items:center; padding:12px 0; font-size:13px; color:var(--ink-soft); }.spinner { height:15px;width:15px;border:2px solid #b8c1b7;border-top-color:var(--evidence);border-radius:50%;animation:spin .75s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
    .modal-backdrop { position:fixed; inset:0; background:#11182088; z-index:5; display:grid; place-items:center; padding:20px }.modal{background:var(--card);border:1px solid var(--rule);box-shadow:0 15px 45px #14181f55;width:min(520px,100%);padding:25px}.modal h2{font:500 29px 'Source Serif 4';margin:0 0 8px}.modal p{font-size:13px;line-height:1.5;color:var(--ink-soft)}.field{display:grid;gap:5px;margin:13px 0}.field label{font:500 10px 'IBM Plex Mono';letter-spacing:.08em;text-transform:uppercase}.field input{border:1px solid var(--rule);background:#fff;padding:10px;border-radius:2px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}.secondary,.primary{padding:9px 13px;border-radius:2px}.secondary{background:transparent;border:1px solid var(--rule)}.primary{border:0;background:var(--ink);color:white}
    @media(max-width:780px){.sidebar{width:68px;padding:20px 10px}.wordmark{font-size:0;padding:8px 5px 32px}.wordmark:before{content:'TR';font:500 21px 'Source Serif 4';}.wordmark small,.catalog-link span:not(.nav-glyph),.shelf-label,.spine-title,.upload-btn span{display:none}.catalog-link,.spine{justify-content:center;padding:12px 5px}.sidebar-foot{grid-template-columns:1fr}.settings-btn{height:36px}.page{padding:34px 22px}.comparison{grid-template-columns:1fr}.detail-title,h1{font-size:36px}.thesis{font-size:23px}.query-form{flex-direction:column}.ask-btn{padding:11px}.detail-top .head-row{align-items:start}.number-grid{grid-template-columns:1fr 1fr}.collection-row{grid-template-columns:90px 1fr 42px}} @media(max-width:480px){.sidebar{display:none}.page{padding:27px 17px}.catalog-grid{grid-template-columns:1fr}.number-grid{grid-template-columns:1fr}.detail-title{font-size:33px}.head-row{align-items:start;flex-direction:column}.map-row{grid-template-columns:85px 1fr 25px}.collection-row{grid-template-columns:78px 1fr 38px}}
  </style>
</head>
<body><div id="app"></div><input id="fileInput" type="file" accept="application/pdf,.pdf" multiple hidden>
<script type="module">
  import * as pdfjsLib from 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.6.82/pdf.min.mjs';
  pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.6.82/pdf.worker.min.mjs';
  const $=s=>document.querySelector(s), store={index:'reading-room-index-v1',settings:'reading-room-settings-v1',thread:'reading-room-thread-v1'};
  let index=JSON.parse(localStorage.getItem(store.index)||'[]'), active='catalog', busy=false, error=''; let settings=JSON.parse(localStorage.getItem(store.settings)||'{"endpoint":"","model":"mistral-small-latest"}'); if(!settings.model||settings.model==='gpt-4o-mini') settings.model='mistral-small-latest'; let thread=JSON.parse(localStorage.getItem(store.thread)||'[]');
  const saveIndex=()=>localStorage.setItem(store.index,JSON.stringify(index)); const id=()=>crypto.randomUUID(); const escape=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
  const record=i=>JSON.parse(localStorage.getItem('reading-room-paper-'+i)||'null'); const saveRecord=p=>localStorage.setItem('reading-room-paper-'+p.id,JSON.stringify(p));
  const limit=(v,n)=>Array.isArray(v)?v.filter(x=>typeof x==='string'&&x.trim()).slice(0,n):[];
  function normalise(a, fallbackTitle){a=a&&typeof a==='object'?a:{};return {title:String(a.title||fallbackTitle),thesis:String(a.thesis||'No thesis was returned.'),summary:String(a.summary||'No summary was returned.'),supportingArguments:limit(a.supportingArguments,5),gaps:{author:limit(a.gaps?.author,4),inferred:limit(a.gaps?.inferred,4)},numbers:(Array.isArray(a.numbers)?a.numbers:[]).filter(x=>x&&x.value).slice(0,6).map(x=>({value:String(x.value),label:String(x.label||'Key reported figure')})),done:limit(a.done,4),todo:limit(a.todo,4)}}
  function parseJson(raw){const clean=String(raw).replace(/```(?:json)?/gi,'').replace(/```/g,'');const start=clean.indexOf('{'),end=clean.lastIndexOf('}');if(start<0||end<=start)throw new Error('The model did not return a JSON object.');return JSON.parse(clean.slice(start,end+1))}
  const analysisPrompt=`You are a gifted research librarian explaining papers to an intelligent non-specialist. Return ONLY a JSON object using exactly this shape: {"title":"","thesis":"","summary":"","supportingArguments":[],"gaps":{"author":[],"inferred":[]},"numbers":[{"value":"","label":""}],"done":[],"todo":[]}. Write in easy, everyday language: prefer short familiar words, explain any unavoidable technical term in the same sentence, and never use academic filler, dense jargon, or unexplained abbreviations. Thesis is 1–2 plain-English sentences and summary is 120–180 words. Both must be genuinely rewritten in your own words, not lightly reworded or copied from the abstract. supportingArguments: max 5 short, concrete bullets. gaps.author: max 4 limitations/future work the AUTHORS explicitly acknowledge. gaps.inferred: max 4 gaps YOU infer that authors did not explicitly state. numbers max 6; each label is a plain-English meaning of 8 words or fewer, not a raw stat. done/todo max 4 each. Do not include markdown or any text outside JSON.`;
  async function llm(messages,jsonMode=false){const res=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:settings.model,endpoint:settings.endpoint,messages,json_mode:jsonMode})});const data=await res.json();if(!res.ok)throw new Error(data.error||'The Reading Room server could not reach the model.');return data.content||''}
  function section(tag,color,title,body){return `<section class="section"><span class="margin-tag" style="color:${color}">${tag}</span><h2 class="section-title">${title}</h2>${body}</section>`}; const list=a=>`<ul class="checklist">${a.length?a.map(x=>`<li>${escape(x)}</li>`).join(''):'<li>No items identified.</li>'}</ul>`;
  function render(){const papers=index.map(x=>record(x.id)).filter(Boolean);const selected=active==='catalog'?null:record(active); $('#app').innerHTML=`<div class="app"><aside class="sidebar"><div class="wordmark">The Reading Room<small>research desk · personal library</small></div><button class="catalog-link ${active==='catalog'?'active':''}" data-nav="catalog"><span class="nav-glyph">▦</span><span>Catalog &amp; Query</span></button><div class="shelf-label">On the shelf · ${index.length}</div><div class="shelf">${index.map(p=>`<button class="spine ${active===p.id?'active':''}" data-nav="${p.id}"><i class="spine-dot"></i><span class="spine-title">${escape(p.title)}</span></button>`).join('')}</div><div class="sidebar-foot"><button class="upload-btn" id="upload"><span>+ Add papers</span></button><button class="settings-btn" id="settings" aria-label="Settings">⚙</button></div></aside><main><div class="page">${error?`<div class="inline-error">${escape(error)}</div>`:''}${busy?`<div class="status"><i class="spinner"></i><span>${escape(busy)}</span></div>`:''}${selected?detail(selected):catalog(papers)}</div></main></div>`; bind();}
  function segments(a){const total=Math.max(1,a.supportingArguments.length+a.gaps.author.length+a.gaps.inferred.length+a.numbers.length+a.done.length+a.todo.length);return [{label:'Evidence',value:a.supportingArguments.length,color:'var(--evidence)'},{label:'Author gaps',value:a.gaps.author.length,color:'var(--author)'},{label:'Inferred gaps',value:a.gaps.inferred.length,color:'var(--inferred)'},{label:'Figures',value:a.numbers.length,color:'var(--numbers)'},{label:'Done',value:a.done.length,color:'#6b9687'},{label:'Left open',value:a.todo.length,color:'#c87763'}].map(x=>({...x,width:Math.max(x.value?4:0,(x.value/total)*100)}));}
  function strip(a){return `<div class="collection-track">${segments(a).map(s=>`<i class="map-segment" style="width:${s.width}%;background:${s.color}" aria-label="${s.label}: ${s.value}"></i>`).join('')}</div>`}
  function catalog(papers){return `<div class="head-row"><div><div class="eyebrow">Personal paper catalog</div><h1>The shelf</h1></div><div class="paper-count">${papers.length} PAPER${papers.length===1?'':'S'} INDEXED</div></div>${papers.length?`<section class="collection-map" aria-label="Collection note map"><h2>What your shelf holds</h2><div class="collection-rows">${papers.map(p=>`<div class="collection-row"><span class="collection-title">${escape(p.analysis.title)}</span>${strip(p.analysis)}<span class="collection-count">${p.analysis.supportingArguments.length+p.analysis.gaps.author.length+p.analysis.gaps.inferred.length+p.analysis.numbers.length} notes</span></div>`).join('')}</div><div class="map-legend"><span><i class="legend-dot" style="background:var(--evidence)"></i>evidence</span><span><i class="legend-dot" style="background:var(--author)"></i>author gaps</span><span><i class="legend-dot" style="background:var(--inferred)"></i>inferred gaps</span><span><i class="legend-dot" style="background:var(--numbers)"></i>figures</span></div></section><div class="catalog-grid">${papers.map(p=>`<button class="paper-card" data-nav="${p.id}"><div class="eyebrow">${escape(p.date)}</div><div class="card-title">${escape(p.analysis.title)}</div><p class="card-thesis">${escape(p.analysis.thesis)}</p><div class="chips"><span class="chip">${p.analysis.supportingArguments.length} evidence</span><span class="chip gap">${p.analysis.gaps.author.length+p.analysis.gaps.inferred.length} gaps</span><span class="chip figure">${p.analysis.numbers.length} figures</span></div></button>`).join('')}</div>`:`<div class="empty"><h2>Start your reading shelf</h2><p>Upload a research paper to extract its argument, evidence, gaps, and key figures.</p><button class="primary" id="emptyUpload">Add a PDF</button></div>`}<div class="desk"><div class="eyebrow" style="color:#a8c6ba">Reference desk</div><h2>Ask across your collection</h2><p>Questions are answered only from the structured notes on your shelf.</p><form class="query-form" id="queryForm"><input class="query-input" id="query" required placeholder="e.g. Which papers report accuracy above 90%?"><button class="ask-btn">Ask the desk →</button></form><div class="thread">${thread.map(q=>`<div class="qa"><div class="qa-q">YOU · ${escape(q.question)}</div><div class="qa-a">${escape(q.answer)}</div></div>`).join('')}</div></div>`}
  function detail(p){let a=p.analysis, s=segments(a);return `<div class="detail-top"><div class="head-row"><div><div class="eyebrow">Reading notes</div><h1 class="detail-title">${escape(a.title)}</h1><div class="file-meta">${escape(p.filename)} · ADDED ${escape(p.date)}</div></div><button class="remove" id="remove">REMOVE PAPER</button></div></div><blockquote class="thesis">“${escape(a.thesis)}”</blockquote><section class="reading-map" aria-label="Paper analysis map"><div class="reading-map-title">Reading footprint</div><div class="map-bars">${s.map(x=>`<div class="map-row"><span>${x.label}</span><div class="map-track"><i class="map-segment" style="width:${x.width}%;background:${x.color}"></i></div><b>${x.value}</b></div>`).join('')}</div></section>${section('in brief','var(--ink-soft)','Summary',`<p class="summary">${escape(a.summary)}</p>`)}${section('evidence','var(--evidence)','Supporting Arguments',list(a.supportingArguments))}${section('gaps','var(--author)','Research Gaps',`<div class="comparison"><div class="compare-card author-card"><h3>Author-identified</h3>${list(a.gaps.author)}</div><div class="compare-card inferred-card"><h3>Inferred</h3>${list(a.gaps.inferred)}</div></div>`)}${section('numbers','var(--numbers)','Key Figures',`<div class="number-grid">${a.numbers.length?a.numbers.map(n=>`<div class="stat"><div class="stat-value">${escape(n.value)}</div><div class="stat-label">${escape(n.label)}</div></div>`).join(''):'<div class="stat"><div class="stat-label">No key figures identified.</div></div>'}</div>`)}${section('what remains','var(--evidence)','Done vs. Left Open',`<div class="comparison"><div class="compare-card done-card"><h3>Done</h3>${list(a.done)}</div><div class="compare-card todo-card"><h3>Left open</h3>${list(a.todo)}</div></div>`)}`}
  function bind(){document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{active=b.dataset.nav;error='';render()});$('#upload')?.addEventListener('click',()=>$('#fileInput').click());$('#emptyUpload')?.addEventListener('click',()=>$('#fileInput').click());$('#settings')?.addEventListener('click',showSettings);$('#remove')?.addEventListener('click',()=>{const p=record(active);if(confirm('Remove “'+p.analysis.title+'” from this shelf?')){localStorage.removeItem('reading-room-paper-'+active);index=index.filter(x=>x.id!==active);saveIndex();active='catalog';render()}});$('#queryForm')?.addEventListener('submit',ask);}
  async function extract(file){const data=new Uint8Array(await file.arrayBuffer());const pdf=await pdfjsLib.getDocument({data}).promise;let text='';for(let page=1;page<=pdf.numPages;page++){const content=await (await pdf.getPage(page)).getTextContent();text+=content.items.map(i=>i.str).join(' ')+'\n';}return text.replace(/\s+/g,' ').trim()}
  $('#fileInput').addEventListener('change',async e=>{for(const file of [...e.target.files])await process(file);e.target.value='';});
  async function process(file){error='';busy='Extracting text from '+file.name+'…';render();try{const text=await extract(file);if(text.length<200)throw new Error('This PDF has no usable text layer. It may be scanned or image-only; try an OCR-enabled copy.');busy='Analyzing with '+settings.model+'…';render();const result=normalise(parseJson(await llm([{role:'system',content:analysisPrompt},{role:'user',content:'Analyze this paper:\n\n'+text.slice(0,120000)}],true)),file.name.replace(/\.pdf$/i,''));const p={id:id(),filename:file.name,date:new Date().toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'}),analysis:result};saveRecord(p);index.unshift({id:p.id,title:p.analysis.title,date:p.date});saveIndex();active=p.id;}catch(e){error=file.name+': '+e.message;}finally{busy=false;render()}}
  async function ask(e){e.preventDefault();const question=$('#query').value.trim();if(!question||!index.length)return;const collection=index.map(x=>{let p=record(x.id),a=p.analysis;return {title:a.title,thesis:a.thesis,summary:a.summary,gaps:a.gaps,numbers:a.numbers}});thread.push({question,answer:'Consulting the shelf…'});localStorage.setItem(store.thread,JSON.stringify(thread));busy='Consulting the Reference Desk with '+settings.model+'…';render();try{const ans=await llm([{role:'system',content:'Answer only from the supplied paper summaries. Name the paper or papers you draw on. If the notes do not support an answer, say so clearly. Be concise and do not invent details.'},{role:'user',content:JSON.stringify({question,papers:collection})}]);thread[thread.length-1].answer=ans;}catch(err){thread[thread.length-1].answer='Unable to answer: '+err.message;}finally{localStorage.setItem(store.thread,JSON.stringify(thread));busy=false;render()}}
  function showSettings(){$('body').insertAdjacentHTML('beforeend',`<div class="modal-backdrop" id="modal"><form class="modal" id="settingsForm"><div class="eyebrow">LLM connection</div><h2>Reference Desk settings</h2><p>Your Mistral API key is read only from <code>.env</code> by the Python server—never saved in the browser. Restart <code>app.py</code> after adding it.</p><div class="field"><label>Endpoint (optional override)</label><input name="endpoint" value="${escape(settings.endpoint)}" placeholder="Uses Mistral server default when blank"></div><div class="field"><label>Model</label><input name="model" value="${escape(settings.model)}" required></div><div class="modal-actions"><button type="button" class="secondary" id="closeModal">Cancel</button><button class="primary">Save settings</button></div></form></div>`);$('#closeModal').onclick=()=>$('#modal').remove();$('#settingsForm').onsubmit=e=>{e.preventDefault();settings=Object.fromEntries(new FormData(e.target));localStorage.setItem(store.settings,JSON.stringify(settings));$('#modal').remove();render()}}
  render();
</script></body></html>
